name: Gaon Ki Baat Daily Update

on:
  schedule:
    # रोज सुबह 8:00 बजे IST
    # GitHub cron UTC में चलता है
    - cron: "30 2 * * *"

  # GitHub Actions से manually भी चला सकें
  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - name: Show date
        run: |
          echo "Gaon Ki Baat Daily Update"
          echo "Date: $(date)"

      - name: Create daily status
        run: |
          mkdir -p data
          echo "Last update: $(date -u)" > data/last-update.txt

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/last-update.txt

          git diff --cached --quiet || git commit -m "Daily website update"

          git push
